<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearline — Weather Dashboard</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-shell">

        <!-- ============ SIDEBAR ============ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="dot"></span> Clearline
            </div>

            <div class="sidebar-section-label">Navigate</div>
            <a class="nav-item active" id="navDashboard" href="{{ url_for('home') }}" style="text-decoration: none;"> <!-- onclick="navClick('dashboard')" -->
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5 12 3l9 7.5"></path>
                    <path d="M5 9.5V21h14V9.5"></path>
                </svg>
                Dashboard
            </a>
            <a class="nav-item" id="navSaved" href="{{ url_for('saved') }}" style="text-decoration: none;">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3.5h12v18l-6-4-6 4v-18z"></path>
                </svg>
                Saved Locations
            </a>
            <div class="nav-item" id="navMaps" onclick="navClick('maps')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4z"></path>
                    <line x1="9" y1="4" x2="9" y2="18"></line>
                    <line x1="15" y1="6.5" x2="15" y2="20.5"></line>
                </svg>
                Weather Maps
                <span class="soon-badge">Soon</span>
            </div>
            <div class="nav-item" id="navAlerts" onclick="navClick('alerts')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z"></path>
                    <path d="M10 19a2 2 0 0 0 4 0"></path>
                </svg>
                Alerts
                <span class="soon-badge">Soon</span>
            </div>
            <div class="nav-item" id="navSettings" onclick="navClick('settings')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.9l.06.06a2 2 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.9-.34 1.7 1.7 0 0 0-1 1.55V19.6a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.9.34l-.06.06a2 2 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.9 1.7 1.7 0 0 0-1.55-1H4.4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.9l-.06-.06a2 2 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.9.34H10.5a1.7 1.7 0 0 0 1-1.55V4.4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.9-.34l.06-.06a2 2 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.9V10.5a1.7 1.7 0 0 0 1.55 1H19.6a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.55 1z">
                    </path>
                </svg>
                Settings
                <span class="soon-badge">Soon</span>
            </div>

            <div class="sidebar-divider"></div>
            <div class="sidebar-section-label">Quick access</div>
            <div class="quick-list" id="quickList"></div>

            <div class="sidebar-spacer"></div>

            <div class="account-box" id="accountBox"></div>
        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

        <!-- ============ MAIN CONTENT ============ -->
        <div class="main-content">

            {% block content %}
            {% endblock content %}

            <footer class="app-footer">
                Clearline — a weather dashboard concept · all data shown is sample data
            </footer>
        </div>
    </div>
</body>

</html>
