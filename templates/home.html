{% extends "layout.html" %}
{% block content %}
    <div id="homeView">
        <div class="home-container">
          <div class="hero-home">
            <div class="eyebrow mb-2">Weather, at a glance</div>
            <h1>Where are you checking on today?</h1>
            <p class="mb-4">Search any city to open its full conditions, forecast, and air quality.</p>

            <div class="search-wrap" style="max-width:520px;">
              <span class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="7"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input id="searchInput" class="search-input" type="text"
                placeholder="Search a city — e.g. Tokyo, Nairobi, Lisbon" autocomplete="off">
              <div id="searchResults" class="search-results"></div>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-3" id="recentAnchor">
            <div class="section-title">Recently visited</div>
            <div id="recentCount" class="eyebrow"></div>
          </div>
          <div id="recentGrid" class="row g-3 mb-5"></div>
        </div>
      </div>
{% endblock content %}
